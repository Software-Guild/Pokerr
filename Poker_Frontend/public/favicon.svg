<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark card background with rounded corners -->
  <rect width="32" height="32" rx="5" fill="#111111"/>
  <!-- White card face inset -->
  <rect x="3" y="3" width="26" height="26" rx="3" fill="#f9f9f9"/>
  <!-- Spade suit centered -->
  <text x="16" y="23" font-size="18" text-anchor="middle" dominant-baseline="auto" fill="#111111" font-family="Georgia, serif">♠</text>
</svg>
